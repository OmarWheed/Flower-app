name: Validate Branch Name

on:
  push:
    branches-ignore:
      - main
      - development
  pull_request:

jobs:
  validate-branch-name-action:
    runs-on: ubuntu-latest

    steps:
      - name: Get branch name
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
      - name: Validate branch name
        run: |
          echo "Validating branch: $BRANCH_NAME"

          # Regex: task-123-description
          PATTERN="^(feature|fix|hotfix|task)-[0-9]+-[a-z0-9-]+$"

          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "❌ Invalid branch name!"
            echo "Branch name must match: task-<id>-<description>"
            echo "Example: task-123-login-screen"
            exit 1
          fi

          echo "✅ Branch name is valid"
