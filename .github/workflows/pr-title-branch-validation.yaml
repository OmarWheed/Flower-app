name: PR Title & Branch Name Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-and-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Show PR & Branch Info
        run: |
          echo "🔎 PR title   : ${{ github.event.pull_request.title }}"
          echo "🌿 Branch name: ${{ github.head_ref }}"

      # ────────────────────────────────
      # PR TITLE VALIDATION
      # Format: type(TICKET): task name
      # Example: feat(FA-17): Validate PR title action
      # ────────────────────────────────
      - name: Validate PR Title
        run: |
          set -e
          TITLE="${{ github.event.pull_request.title }}"

          TYPES="fix|feat|hotfix|release|build|test"
          TICKET="[A-Z]{2,10}-[0-9]{1,5}"

          REGEX="^(${TYPES})\(${TICKET}\):[[:space:]]+[A-Za-z0-9].*$"

          if [[ ! "$TITLE" =~ $REGEX ]]; then
            echo ""
            echo "❌ Invalid PR title format"
            echo "----------------------------------------"
            echo "Current : $TITLE"
            echo ""
            echo "Expected format:"
            echo "  type(TICKET): task name"
            echo ""
            echo "Allowed types: $TYPES"
            echo "Allowed tickets: FA-17, FTA-26, APP-145, JIRA-918"
            echo ""
            echo "Valid examples:"
            echo "  feat(FA-17): Validate PR title action"
            echo "  fix(APP-145): Handle null user profile"
            echo "  hotfix(JIRA-918): Fix iOS keyboard overlap"
            exit 1
          fi

          echo "✅ PR title format is valid"

      # ────────────────────────────────
      # BRANCH NAME VALIDATION
      # Format: feature/TICKET-task-name
      # Example: feature/FA-17-validate-pr-title-action
      # ────────────────────────────────
      - name: Validate Branch Name
        run: |
          BRANCH="${{ github.head_ref }}"
          TYPES="feature|fix|hotfix|release|build|test"
          TICKET="[A-Z]{2,10}-[0-9]{1,5}"

          REGEX="^(${TYPES})/${TICKET}-[a-z0-9-]+$"

          if [[ ! "$BRANCH" =~ $REGEX ]]; then
            echo "❌ Invalid branch name format"
            echo "----------------------------------------"
            echo "Current branch : $BRANCH"
            echo ""
            echo "Expected format:"
            echo "  feature/TICKET-task-name"
            echo ""
            echo "Valid example:"
            echo "  feature/FA-17-validate-pr-title-action"
            echo "  feature/FTA-26-order-live-updates"
            exit 1
          fi

          echo "✅ Branch name format is valid"